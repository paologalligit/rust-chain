[package]
name = "rust-chain"
version = "0.1.0"
edition = "2021"
description = "An educational proof-of-work blockchain prototype in Rust"
repository = "https://github.com/milkshakeWaves/rust-chain"
readme = "README.md"
publish = false

[dependencies]
chrono = "0.4.45"
hex = "0.4.3"
rand = "0.10.3"
secp256k1 = { version = "0.33.1", features = ["rand", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
